name: Unit test
on:
  push:

jobs:
  run_test:
    name: Run service unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./service/package-lock.json
      - name: Install dependencies
        working-directory: ./service
        run: npm ci
      - name: Run unit test
        working-directory: ./service
        run: npm run test
