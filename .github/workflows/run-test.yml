name: Run Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./service/package-lock.json"

      - name: Install dependencies
        working-directory: ./service
        run: npm ci

      - name: Wait for DynamoDB
        run: |
          timeout 30 sh -c 'until curl -s http://localhost:8000 > /dev/null; do sleep 1; done'

      - name: Run tests
        working-directory: ./service
        run: npx vitest run
