name: Run Tests

on:
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./service/package-lock.json"

      - name: Install dependencies
        working-directory: ./service
        run: npm ci

      - name: Run tests
        working-directory: ./service
        run: npx vitest run
