apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stores.tams.trackit.io
spec:
  group: tams.trackit.io
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [database]
              properties:
                database:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [dynamodb, memory]
                    flowTableName:
                      type: string
                    serviceTableName:
                      type: string
                    region:
                      type: string
                    endpoint:
                      type: string
                  oneOf:
                    - properties:
                        type:
                          enum: [dynamodb]
                      required:
                        - flowTableName
                        - serviceTableName
                    - properties:
                        type:
                          enum: [memory]

                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                server:
                  type: object
                  properties:
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                logs:
                  type: object
                  properties:
                    level:
                      type: string
                      enum: [debug, info, warn, error]
            status:
              type: object
              properties:
                availableReplicas:
                  type: integer
      subresources:
        status: {}
  names:
    kind: Store
    plural: stores
  scope: Namespaced