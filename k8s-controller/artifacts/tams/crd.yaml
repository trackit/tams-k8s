apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stores.tams.trackit.io
spec:
  group: tams.trackit.io
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                deploymentName:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                logs:
                  type: object
                  properties:
                    level:
                      type: string
                      enum: [debug, info, warn, error]
            status:
              type: object
              properties:
                availableReplicas:
                  type: integer
          required:
            - spec
      subresources:
        status: {}
  names:
    kind: Store
    plural: stores
  scope: Namespaced